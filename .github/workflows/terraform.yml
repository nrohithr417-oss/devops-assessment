
name: Terraform Validation

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:

jobs:
  validate-dev:
    name: Validate Dev
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      AWS_EC2_METADATA_DISABLED: "true"

    defaults:
      run:
        working-directory: infra/envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../../..

      - name: Initialize Terraform
        run: terraform init -reconfigure

      - name: Validate Terraform
        run: terraform validate

      - name: Generate Terraform plan
        run: |
          set -o pipefail
          terraform plan -no-color -refresh=false -input=false -var="db_password=AssessmentOnly123!" | tee terraform-plan.txt

      - name: Upload Dev Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: dev-terraform-plan
          path: infra/envs/dev/terraform-plan.txt

  validate-prod:
    name: Validate Production
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      AWS_EC2_METADATA_DISABLED: "true"

    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../../..

      - name: Initialize Terraform
        run: terraform init -reconfigure

      - name: Validate Terraform
        run: terraform validate

      - name: Generate Terraform plan
        run: |
          set -o pipefail
          terraform plan -no-color -refresh=false -input=false -var="db_password=AssessmentOnly123!" | tee terraform-plan.txt

      - name: Upload Production Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: prod-terraform-plan
          path: infra/envs/prod/terraform-plan.txt
